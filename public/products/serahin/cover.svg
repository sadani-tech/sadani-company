<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Serahin app on a phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDEDEA"/><stop offset="1" stop-color="#D9D8D2"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F8F8F"/><stop offset="1" stop-color="#F2C94C"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A2A2A"/><stop offset=".5" stop-color="#4A4A4A"/><stop offset="1" stop-color="#1E1E1E"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="900" cy="160" rx="320" ry="200" fill="#fff" opacity=".7" filter="url(#soft)"/>
  <rect x="0" y="560" width="1200" height="240" fill="#CFCDC6"/>
  <rect x="0" y="556" width="1200" height="8" fill="#E7E6E1"/>
  <!-- plant -->
  <rect x="150" y="440" width="70" height="120" rx="8" fill="#F4F4F2"/>
  <path d="M185 440 C150 380 120 360 110 330 C150 350 170 380 185 420 C190 370 200 330 230 300 C225 350 205 400 190 440Z" fill="#6E7A68"/>
  <!-- mug -->
  <rect x="930" y="470" width="90" height="100" rx="12" fill="#F7F7F5"/>
  <path d="M1020 495 h22 a22 22 0 0 1 0 44 h-22" fill="none" stroke="#F7F7F5" stroke-width="12"/>
  <!-- phone shadow -->
  <ellipse cx="610" cy="700" rx="230" ry="26" fill="#000" opacity=".28" filter="url(#sh)"/>
  <g transform="translate(470 90) rotate(-4 130 280)">
    <rect width="280" height="580" rx="44" fill="url(#body)"/>
    <rect x="12" y="12" width="256" height="556" rx="34" fill="#FAFAF8"/>
    <rect x="100" y="24" width="80" height="20" rx="10" fill="#1E1E1E"/>
    <text x="34" y="92" font-family="Montserrat, Arial, sans-serif" font-size="13" fill="#8A8A8A">Halo, Dimas</text>
    <text x="34" y="120" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="22" fill="#1A1A1A">Serahin</text>
    <rect x="34" y="140" width="212" height="84" rx="16" fill="url(#gold)"/>
    <text x="52" y="172" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="13" fill="#fff">Titip belanja pasar</text>
    <rect x="52" y="186" width="110" height="8" rx="4" fill="#fff" opacity=".7"/>
    <rect x="52" y="202" width="70" height="8" rx="4" fill="#fff" opacity=".5"/>
    <g font-family="Montserrat, Arial, sans-serif" font-size="12" fill="#1A1A1A">
      <rect x="34" y="244" width="212" height="64" rx="14" fill="#F0F0EC"/>
      <circle cx="62" cy="276" r="14" fill="#DADAD4"/><path d="M55 276 l5 5 l10 -10" stroke="#1A1A1A" stroke-width="2.4" fill="none"/>
      <rect x="86" y="266" width="100" height="8" rx="4" fill="#1A1A1A"/><rect x="86" y="282" width="70" height="7" rx="3.5" fill="#A5A5A0"/>
      <rect x="34" y="318" width="212" height="64" rx="14" fill="#F0F0EC"/>
      <circle cx="62" cy="350" r="14" fill="#F2C94C"/>
      <rect x="86" y="340" width="120" height="8" rx="4" fill="#1A1A1A"/><rect x="86" y="356" width="60" height="7" rx="3.5" fill="#A5A5A0"/>
      <rect x="34" y="392" width="212" height="64" rx="14" fill="#F0F0EC"/>
      <circle cx="62" cy="424" r="14" fill="#DADAD4"/>
      <rect x="86" y="414" width="90" height="8" rx="4" fill="#1A1A1A"/><rect x="86" y="430" width="80" height="7" rx="3.5" fill="#A5A5A0"/>
    </g>
    <rect x="34" y="480" width="212" height="48" rx="24" fill="#1A1A1A"/>
    <text x="140" y="509" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="13" fill="#fff">Buat permintaan</text>
  </g>
